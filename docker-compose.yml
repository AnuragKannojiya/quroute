services:
  quantum-service:
    build: ./quantum-service
    container_name: quroute-quantum
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: quroute-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - QUANTUM_SERVICE_URL=http://quantum-service:8001
      - QUANTUM_TIMEOUT_MS=15000
      - CACHE_TTL_MS=300000
    depends_on:
      quantum-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: quroute-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

